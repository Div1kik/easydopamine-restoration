<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Артефакты времени</title>

  <!-- Полный запрет кэширования для мобильных браузеров -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Подключение гладких шрифтов с поддержкой кириллицы -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0d0906;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-container {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1c130c 0%, #090604 100%);
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform: translateZ(0);
      backface-visibility: hidden;
      box-shadow: 0 0 36px rgba(0, 0, 0, 0.9);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<body>
  <div id="game-container"></div>

  <!-- Загрузчик с уникальным таймстампом при каждом открытии страницы -->
  <script type="module">
    const timestamp = Date.now();
    import(`./src/main.js?t=${timestamp}`).catch((err) => {
      console.error('Ошибка загрузки main.js:', err);
    });
  </script>
</body>
</html>
