<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d0805" />
  <title>Артефакты Времени — Мастерская реставратора</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://yandex.ru/games/sdk/v2"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0805;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });
  </script>

  <script type="module">
    const startApp = async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await Promise.race([
            document.fonts.ready,
            new Promise((resolve) => setTimeout(resolve, 1000))
          ]);
        }
      } catch {}
      await import('./src/main.js');
    };
    startApp();
  </script>
</body>
</html>
