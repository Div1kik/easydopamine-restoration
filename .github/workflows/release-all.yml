name: Build All Platforms (Web + RuStore APK + Google Play AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Prepare clean www bundle (Web / Yandex / VK)
        run: |
          mkdir -p www
          cp index.html www/
          cp -r src www/
          cp -r assets www/
          cd www && zip -r ../web-release.zip . && cd ..

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "Артефакты Времени" "com.easydopamine.artefactsoftime" --web-dir=www
          npx cap add android

      - name: Configure Android Manifest, Fullscreen & Cutout
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="portrait"/g' "$MANIFEST"

          STYLES="android/app/src/main/res/values/styles.xml"
          cat << 'EOF' > "$STYLES"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:windowBackground">#0d0805</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#0d0805</item>
                  <item name="android:windowBackground">#0d0805</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowTranslucentNavigation">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">#0d0805</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.easydopamine.artefactsoftime",
            "appName": "Артефакты Времени",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "backgroundColor": "#0d0805"
            }
          }
          EOF
          npx cap copy android

      - name: Generate Android App Icons & Store Icon (512x512)
        run: |
          mkdir -p release-outputs
          RES_DIR="android/app/src/main/res"
          ICON_SRC="assets/icon.png"

          if [ -f "$ICON_SRC" ]; then
            echo "Нарезка иконки assets/icon.png под все плотности Android..."
            npm install --no-save sharp
            node -e '
              const sharp = require("sharp");
              const fs = require("fs");
              const src = "assets/icon.png";
              const res = "android/app/src/main/res";
              const densities = [
                { dir: "mipmap-mdpi", size: 48 },
                { dir: "mipmap-hdpi", size: 72 },
                { dir: "mipmap-xhdpi", size: 96 },
                { dir: "mipmap-xxhdpi", size: 144 },
                { dir: "mipmap-xxxhdpi", size: 192 }
              ];
              (async () => {
                for (const d of densities) {
                  fs.mkdirSync(`${res}/${d.dir}`, { recursive: true });
                  await sharp(src).resize(d.size, d.size).png().toFile(`${res}/${d.dir}/ic_launcher.png`);
                  await sharp(src).resize(d.size, d.size).png().toFile(`${res}/${d.dir}/ic_launcher_round.png`);
                  await sharp(src).resize(d.size, d.size).png().toFile(`${res}/${d.dir}/ic_launcher_foreground.png`);
                }
                await sharp(src).resize(512, 512).png().toFile("release-outputs/StoreIcon-512x512.png");
                console.log("Все иконки успешно сгенерированы!");
              })();
            '
          else
            echo "Файл assets/icon.png не найден, используются стандартные иконки."
          fi

      - name: Prepare Android Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="android/app/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "SIGN_STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
              -alias artefacts_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "Artefacts2026!" -keypass "Artefacts2026!" \
              -dname "CN=Easy Dopamine Games, OU=GameDev, O=EasyDopamine, L=SaintPetersburg, C=RU"
            echo "SIGN_STORE_PASSWORD=Artefacts2026!" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=artefacts_key" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=Artefacts2026!" >> $GITHUB_ENV
          fi

          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("SIGN_STORE_PASSWORD")
                      keyAlias System.getenv("SIGN_KEY_ALIAS")
                      keyPassword System.getenv("SIGN_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

      - name: Build Signed APK (RuStore) & Signed AAB (Google Play)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          cd ..
          mkdir -p release-outputs
          cp android/app/build/outputs/apk/release/app-release.apk release-outputs/ArtefactsOfTime-RuStore-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-outputs/ArtefactsOfTime-GooglePlay-release.aab
          cp web-release.zip release-outputs/ArtefactsOfTime-Web-Yandex-VK.zip

      - name: Upload Release Artifacts (Web + APK + AAB + StoreIcon)
        uses: actions/upload-artifact@v4
        with:
          name: ArtefactsOfTime-All-Platforms
          path: release-outputs/
          retention-days: 30
